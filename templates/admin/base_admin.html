<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %} — Cognito Inc.</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 240px; background: #1a1a2e; color: #fff; display: flex; flex-direction: column; position: fixed; height: 100vh; }
        .sidebar-brand { padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,.1); }
        .sidebar-brand h2 { font-size: 1.1rem; font-weight: 700; color: #6c63ff; }
        .sidebar-brand span { font-size: .75rem; color: #888; }
        .sidebar-nav { flex: 1; padding: 16px 0; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: #aaa; text-decoration: none; font-size: .9rem; transition: all .2s; }
        .nav-item:hover, .nav-item.active { background: rgba(108,99,255,.2); color: #fff; }
        .nav-item i { width: 18px; text-align: center; }
        .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,.1); }
        .sidebar-footer a { display: flex; align-items: center; gap: 10px; color: #888; text-decoration: none; font-size: .85rem; }
        .sidebar-footer a:hover { color: #fff; }

        /* Main */
        .main { margin-left: 240px; flex: 1; padding: 32px; }
        .page-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; color: #1a1a2e; }

        /* Cards */
        .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 24px; }
        .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 16px; color: #444; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; }

        /* Stats */
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        .stat-card .label { font-size: .8rem; color: #888; text-transform: uppercase; letter-spacing: .05em; }
        .stat-card .value { font-size: 2rem; font-weight: 700; color: #6c63ff; margin-top: 4px; }

        /* Table */
        table { width: 100%; border-collapse: collapse; font-size: .88rem; }
        th { text-align: left; padding: 10px 12px; color: #888; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; background: #f8f9fb; }
        td { padding: 12px; border-bottom: 1px solid #f0f2f5; vertical-align: top; }
        tr:last-child td { border-bottom: none; }
        .empty { text-align: center; color: #aaa; padding: 40px; }

        /* Badges */
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: .75rem; font-weight: 600; }
        .badge-green  { background: #e6f9f0; color: #1a7f4b; }
        .badge-orange { background: #fff3e0; color: #e65100; }
        .badge-purple { background: #ede7f6; color: #5e35b1; }

        /* Forms */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: .85rem; font-weight: 600; color: #555; margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 14px; border: 1.5px solid #e0e0e0; border-radius: 8px;
            font-size: .9rem; font-family: inherit; transition: border-color .2s; background: #fafafa;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: #6c63ff; background: #fff;
        }
        .form-group textarea { resize: vertical; }
        .form-group.span-2 { grid-column: 1 / -1; }

        /* Buttons */
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 8px; font-size: .88rem; font-weight: 600; cursor: pointer; border: none; text-decoration: none; transition: all .2s; }
        .btn-primary  { background: #6c63ff; color: #fff; }
        .btn-primary:hover  { background: #5a52d5; }
        .btn-success  { background: #1a7f4b; color: #fff; }
        .btn-success:hover  { background: #156040; }
        .btn-danger   { background: #e53935; color: #fff; }
        .btn-danger:hover   { background: #c62828; }
        .btn-secondary { background: #f0f2f5; color: #444; }
        .btn-secondary:hover { background: #e0e0e0; }
        .btn-outline  { background: transparent; border: 1.5px solid #6c63ff; color: #6c63ff; }
        .btn-outline:hover  { background: #6c63ff; color: #fff; }
        .btn-sm { padding: 6px 12px; font-size: .8rem; }

        /* Alert */
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: .9rem; }
        .alert-error   { background: #fdecea; color: #b71c1c; }
        .alert-success { background: #e8f5e9; color: #1b5e20; }
        .alert-info    { background: #e3f2fd; color: #0d47a1; }

        /* Status dot */
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .dot-green  { background: #4caf50; }
        .dot-red    { background: #f44336; }

        /* Actions row */
        .actions { display: flex; gap: 8px; }
        .page-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }

        /* Truncate */
        .truncate { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* AI button */
        .btn-ai { background: linear-gradient(135deg, #6c63ff, #a855f7); color: #fff; }
        .btn-ai:hover { opacity: .9; }

        /* Spinner */
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-brand">
        <h2>Cognito Inc.</h2>
        <span>Panel Admin</span>
    </div>
    <nav class="sidebar-nav">
        <a href="{{ url_for('admin_dashboard') }}" class="nav-item {% if request.endpoint == 'admin_dashboard' %}active{% endif %}">
            <i class="fas fa-tachometer-alt"></i> Dashboard
        </a>
        <a href="{{ url_for('admin_projects') }}" class="nav-item {% if 'project' in request.endpoint %}active{% endif %}">
            <i class="fas fa-folder-open"></i> Projets
        </a>
        <a href="{{ url_for('admin_links') }}" class="nav-item {% if request.endpoint == 'admin_links' %}active{% endif %}">
            <i class="fas fa-link"></i> Liens sociaux
        </a>
        <a href="{{ url_for('admin_testimonials') }}" class="nav-item {% if 'testimonial' in request.endpoint %}active{% endif %}">
            <i class="fas fa-star"></i> Témoignages
        </a>
        <a href="{{ url_for('admin_bot') }}" class="nav-item {% if request.endpoint == 'admin_bot' %}active{% endif %}">
            <i class="fas fa-robot"></i> Bot Telegram
        </a>
        <a href="{{ url_for('home') }}" class="nav-item" target="_blank">
            <i class="fas fa-external-link-alt"></i> Voir le site
        </a>
    </nav>
    <div class="sidebar-footer">
        <a href="{{ url_for('admin_logout') }}"><i class="fas fa-sign-out-alt"></i> Déconnexion</a>
    </div>
</aside>
<main class="main">
    {% block content %}{% endblock %}
</main>
</body>
</html>
