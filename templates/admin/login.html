<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin — Cognito Inc.</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1a1a2e, #16213e); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #fff; border-radius: 16px; padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo h1 { font-size: 1.5rem; font-weight: 800; color: #6c63ff; }
        .logo p  { font-size: .85rem; color: #888; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: .85rem; font-weight: 600; color: #555; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: .95rem; transition: border-color .2s; }
        .form-group input:focus { outline: none; border-color: #6c63ff; }
        .btn-login { width: 100%; padding: 13px; background: #6c63ff; color: #fff; border: none; border-radius: 8px; font-size: .95rem; font-weight: 600; cursor: pointer; transition: background .2s; margin-top: 8px; }
        .btn-login:hover { background: #5a52d5; }
        .error { background: #fdecea; color: #b71c1c; padding: 10px 14px; border-radius: 8px; font-size: .85rem; margin-bottom: 16px; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo">
        <h1>Cognito Inc.</h1>
        <p>Panel d'administration</p>
    </div>
    {% if error %}
    <div class="error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
    {% endif %}
    <form method="POST">
        <div class="form-group">
            <label for="password"><i class="fas fa-lock"></i> Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="••••••••" autofocus required>
        </div>
        <button type="submit" class="btn-login">Se connecter</button>
    </form>
</div>
</body>
</html>
